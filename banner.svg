<svg width="850" height="75" viewBox="0 0 850 75" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Default / Dark Mode */
      .banner-bg { fill: #0d1117; }
      .banner-dot { fill: #238636; opacity: 0.28; }
      .quote-green { fill: #39d353; }
      .quote-accent { fill: #ffffff; font-weight: 700; }

      /* GitHub Light Mode Overrides */
      @media (prefers-color-scheme: light) {
        .banner-bg { fill: #f6f8fa; }
        .banner-dot { fill: #1a7f37; opacity: 0.20; }
        .quote-green { fill: #1a7f37; }
        .quote-accent { fill: #1f2328; font-weight: 700; }
      }
    </style>

    <!-- Dynamic Dot Pattern -->
    <pattern id="minimalDots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" class="banner-dot" />
    </pattern>
  </defs>

  <!-- Adaptive Background (No Border) -->
  <rect width="850" height="75" rx="8" class="banner-bg" />

  <!-- Dotted Texture Accents -->
  <rect x="12" y="10" width="70" height="55" rx="4" fill="url(#minimalDots)" />
  <rect x="768" y="10" width="70" height="55" rx="4" fill="url(#minimalDots)" />

  <!-- Adaptive Minimalist Quote -->
  <text x="425" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.3">
    <tspan class="quote-green">To have </tspan>
    <tspan class="quote-accent">something</tspan>
    <tspan class="quote-green"> you’ve never had before, you must become </tspan>
    <tspan class="quote-accent">someone</tspan>
    <tspan class="quote-green"> you’ve never been before.</tspan>
  </text>
</svg>
