<svg width="650" height="70" viewBox="0 0 650 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Default / Dark Mode */
      .banner-bg { fill: #0d1117; }
      .banner-dot { fill: #39d353; opacity: 0.65; }
      .quote-green { fill: #39d353; }
      .quote-accent { fill: #ffffff; font-weight: 700; }

      /* GitHub Light Mode Overrides */
      @media (prefers-color-scheme: light) {
        .banner-bg { fill: #f6f8fa; }
        .banner-dot { fill: #1a7f37; opacity: 0.55; }
        .quote-green { fill: #1a7f37; }
        .quote-accent { fill: #1f2328; font-weight: 700; }
      }
    </style>

    <!-- Prominent Dynamic Dot Pattern -->
    <pattern id="minimalDots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" class="banner-dot" />
    </pattern>
  </defs>

  <!-- Adaptive Background -->
  <rect width="650" height="90" rx="8" class="banner-bg" />

  <!-- Asymmetric Dot Grid Panels -->
  <!-- Kaliwang panel: Naka-angat sa bandang itaas -->
  <rect x="16" y="8" width="70" height="48" rx="4" fill="url(#minimalDots)" />

  <!-- Kanang panel: Naka-baba sa bandang ilalim -->
  <rect x="564" y="34" width="70" height="48" rx="4" fill="url(#minimalDots)" />

  <!-- Line 1 -->
  <text x="325" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.3">
    <tspan class="quote-green">To have </tspan>
    <tspan class="quote-accent">something</tspan>
    <tspan class="quote-green"> you’ve never had before,</tspan>
  </text>

  <!-- Line 2 -->
  <text x="325" y="55" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.3">
    <tspan class="quote-green">you must become </tspan>
    <tspan class="quote-accent">someone</tspan>
    <tspan class="quote-green"> you’ve never been before.</tspan>
  </text>
</svg>
