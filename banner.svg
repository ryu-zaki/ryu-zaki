<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="60%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#238636" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="850" height="150" rx="12" fill="url(#cardBg)" stroke="#238636" stroke-width="1.5"/>

  <!-- Tech Dot Grid Accents -->
  <rect x="15" y="15" width="130" height="120" rx="8" fill="url(#dotGrid)" />
  <rect x="705" y="15" width="130" height="120" rx="8" fill="url(#dotGrid)" />

  <!-- Corner Tech Accent Lines -->
  <line x1="20" y1="20" x2="60" y2="20" stroke="#39d353" stroke-width="2" opacity="0.7"/>
  <line x1="20" y1="20" x2="20" y2="60" stroke="#39d353" stroke-width="2" opacity="0.7"/>
  <line x1="830" y1="130" x2="790" y2="130" stroke="#39d353" stroke-width="2" opacity="0.7"/>
  <line x1="830" y1="130" x2="830" y2="90" stroke="#39d353" stroke-width="2" opacity="0.7"/>

  <!-- Center Decorative Glow Divider -->
  <line x1="325" y1="75" x2="525" y2="75" stroke="#238636" stroke-width="1" opacity="0.5"/>

  <!-- Quotation Line 1 -->
  <text x="425" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
    <tspan fill="#39d353">To have </tspan>
    <tspan fill="#ffffff" font-weight="700">something</tspan>
    <tspan fill="#39d353"> you’ve never had before,</tspan>
  </text>

  <!-- Quotation Line 2 -->
  <text x="425" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
    <tspan fill="#39d353">you must become </tspan>
    <tspan fill="#ffffff" font-weight="700">someone</tspan>
    <tspan fill="#39d353"> you’ve never been before.</tspan>
  </text>
</svg>
