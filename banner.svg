<svg width="850" height="75" viewBox="0 0 850 75" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle Green Dot Pattern -->
    <pattern id="minimalDots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#238636" opacity="0.28" />
    </pattern>
  </defs>

  <!-- Dark Background (No Border) -->
  <rect width="850" height="75" rx="8" fill="#0d1117"/>

  <!-- Minimal Dotted Texture Accents -->
  <rect x="12" y="10" width="70" height="55" rx="4" fill="url(#minimalDots)" />
  <rect x="768" y="10" width="70" height="55" rx="4" fill="url(#minimalDots)" />

  <!-- Centered Minimalist Quote -->
  <text x="425" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.3">
    <tspan fill="#39d353">To have </tspan>
    <tspan fill="#ffffff" font-weight="700">something</tspan>
    <tspan fill="#39d353"> you’ve never had before, you must become </tspan>
    <tspan fill="#ffffff" font-weight="700">someone</tspan>
    <tspan fill="#39d353"> you’ve never been before.</tspan>
  </text>
</svg>
