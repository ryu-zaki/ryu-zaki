<svg width="850" height="95" viewBox="0 0 850 95" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#238636" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base Compact Card -->
  <rect width="850" height="95" rx="10" fill="url(#cardBg)" stroke="#238636" stroke-width="1.2"/>

  <!-- Compact Dot Grid Accents -->
  <rect x="15" y="12" width="80" height="71" rx="6" fill="url(#dotGrid)" />
  <rect x="755" y="12" width="80" height="71" rx="6" fill="url(#dotGrid)" />

  <!-- Corner Tech Accent Lines -->
  <path d="M 22 34 L 22 20 L 36 20" stroke="#39d353" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 828 61 L 828 75 L 814 75" stroke="#39d353" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Quote in a Single Sleek Line -->
  <text x="425" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
    <tspan fill="#39d353">To have </tspan>
    <tspan fill="#ffffff" font-weight="700">something</tspan>
    <tspan fill="#39d353"> you’ve never had before, you must become </tspan>
    <tspan fill="#ffffff" font-weight="700">someone</tspan>
    <tspan fill="#39d353"> you’ve never been before.</tspan>
  </text>
</svg>
